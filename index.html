<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой VIN-декодер</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 600px; }
        h2 { margin-top: 0; color: #1a1a1a; }
        p { color: #666; font-size: 14px; }
        .input-group { display: flex; gap: 10px; margin: 20px 0; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-transform: uppercase; }
        button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: 600; }
        button:hover { background: #1d4ed8; }
        .result { margin-top: 20px; background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 6px; display: none; max-height: 400px; overflow-y: auto; }
        .result h3 { margin-top: 0; font-size: 16px; color: #334155; }
        ul { padding-left: 20px; margin: 0; }
        li { margin-bottom: 6px; font-size: 14px; color: #334155; }
        .error { color: #dc2626; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Проверка автомобиля по VIN</h2>
        <p>Введите 17-значный VIN-код, чтобы расшифровать заводские характеристики:</p>
        
        <div class="input-group">
            <input type="text" id="vinInput" maxlength="17" placeholder="Например: WVWZZZ...">
            <button onclick="decodeVin()">Проверить</button>
        </div>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        async function decodeVin() {
            const vin = document.getElementById('vinInput').value.trim().toUpperCase();
            const resultDiv = document.getElementById('result');
            
            if (vin.length !== 17) {
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = '<span class="error">Ошибка: VIN-код должен состоять ровно из 17 символов!</span>';
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.innerHTML = 'Загрузка данных из базы...';

            try {
                // Запрос к бесплатному официальному NHTSA API
                const response = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVin/${vin}?format=json`);
                const data = await response.json();
                
                let html = '<h3>Характеристики автомобиля:</h3><ul>';
                let foundAny = false;

                data.Results.forEach(item => {
                    // Выводим только те параметры, для которых есть реальные данные
                    if (item.Value && item.Value !== null && item.Value !== "" && item.Value !== "0" && item.Value !== "Not Applicable") {
                        html += `<li><strong>${item.Variable}:</strong> ${item.Value}</li>`;
                        foundAny = true;
                    }
                });
                
                html += '</ul>';
                if (!foundAny) {
                    html = '<p class="error">По данному VIN ничего не найдено в базе.</p>';
                }
                
                resultDiv.innerHTML = html;
            } catch (error) {
                resultDiv.innerHTML = '<span class="error">Произошла ошибка при соединении с сервером.</span>';
            }
        }
    </script>
</body>
</html>
